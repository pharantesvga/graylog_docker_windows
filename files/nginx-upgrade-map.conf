# Necessário para o reverse proxy do Graylog (server_name graylog.esr.local
# em /etc/nginx/sites-available/default) suportar a conexão WebSocket usada
# pela UI do Graylog para atualizações em tempo real.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Suprime do access_log o tráfego de polling que a própria UI do Graylog
# gera contra sua API (/api/cluster/metrics/multiple, /api/system/cluster/nodes,
# /api/system/notifications etc.) quando acessada via graylog.esr.local — sem
# isso, esse tráfego de auto-atualização é coletado pelo Filebeat e aparece
# no Graylog como se fosse navegação real (loop de auto-ingestão).
map $request_uri $loggable {
    ~^/api/  0;
    default  1;
}