# ---------------------------------------------------------------------
# Ponto de entrada único (porta 80) do laboratório: reverse proxy para a
# interface web do Graylog (container "graylog", porta 9000 interna),
# acessível via navegador sem especificar porta.
#
# Como este é o único site publicado na porta 80, o bloco é
# "default_server" e responde a qualquer Host header — inclusive
# http://graylog.esr/ (sem ".local"), que passa a ser o nome preferido.
# ---------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name graylog.esr graylog.esr.local _;

    access_log /var/log/nginx/graylog-proxy-access.log combined if=$loggable;
    error_log  /var/log/nginx/graylog-proxy-error.log;

    # Resolução via DNS embutido do Docker (127.0.0.11 nas redes bridge
    # definidas pelo usuário, como a rede "graylog" deste compose).
    #
    # ⚠️ Sem isto, o nginx resolveria "graylog" apenas uma vez, no boot,
    # e recusaria subir ("host not found in upstream") caso o container
    # graylog ainda não exista/esteja registrado no DNS nesse momento —
    # cenário provável aqui, já que graylog depende do linserver (NTP) e
    # não o contrário, então o linserver frequentemente sobe primeiro.
    # Usar $graylog_upstream (variável) força o nginx a resolver o nome
    # de forma preguiçosa, a cada requisição, respeitando o TTL abaixo.
    resolver 127.0.0.11 valid=30s;

    location / {
        set $graylog_upstream http://graylog:9000;
        proxy_pass $graylog_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A UI do Graylog usa WebSocket para atualizações em tempo real
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
    }
}
